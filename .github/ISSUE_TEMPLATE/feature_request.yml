name: Feature proposal
description: Propose an improvement before implementation.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe a real use case and who would benefit.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version and any alternatives considered.
    validations:
      required: true
  - type: checkboxes
    id: participation
    attributes:
      label: Participation
      options:
        - label: I would like to help implement or test this.
