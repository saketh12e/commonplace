name: Bug report
description: Report a reproducible problem in Commonplace.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Do not include private data or credentials.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and screen size
      placeholder: Firefox on Linux, 1440px wide
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional context
      description: Include the commit or version if you know it. Remove private information from screenshots.
